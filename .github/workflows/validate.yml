name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.7.13"
      - run: pip install --requirement requirements-dev.txt
      - run: ruff check scripts tests
      - run: ./scripts/validate
